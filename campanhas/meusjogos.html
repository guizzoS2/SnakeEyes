<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Campanha</title>
    <link rel="stylesheet" href="../src/css/geral.css">
    <link rel="stylesheet" href="../src/css/meusjogos.css">
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Tela do Mestre</h1>
    

    <div class="tabs">
        <button class="tab-button active" data-tab="characters-tab">Personagens</button>
        <button class="tab-button" data-tab="resources-tab">Recursos do Bando</button>
    </div>

    <div id="characters-tab" class="tab-content active">
        <!-- <h2>Personagens na Campanha</h2> -->
        <ul id="lista-personagens"></ul>
            
        <!-- Link de Convite -->
        <div class="invite-container">
            <h3>Convide Jogadores</h3>
            <p>Compartilhe este link para que outros jogadores possam entrar na campanha:</p>
            <div class="invite-box">
                <input type="text" id="invite-link" readonly>
                <button id="copy-invite-btn">📋 Copiar Link</button>
        </div>
        
    </div>
    </div>

    <div id="resources-tab" class="tab-content">
        <div class="container">
            <div class="bando-nome">
                <h1 id="bando-nome">Nome do Bando</h1>
            </div>
    
            <div class="content">
                <div class="box relacoes">
                    <h2>Relações</h2>
                    <ul id="relations-list"></ul>
                </div>
    
                <div class="box recursos">
                    <h2>Recursos</h2>
                    <ul id="resources-list"></ul>
                </div>
    
                <div class="box membros">
                    <h2>Membros</h2>
                    <ul id="bando-membros"></ul>
                </div>
    
                <div class="box anotacoes">
                    <h2>Anotações</h2>
                    <textarea id="bando-anotacoes" rows="5" placeholder="Escreva aqui..."></textarea>
                    <button id="salvar-anotacoes">Salvar</button>
                </div>
            </div>
        </div>

    
    <script type="module" src=".././admin/"></script>
    <script type="module" src="../src/js/meusjogos.js"></script>
</body>
</html>
